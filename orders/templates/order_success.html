
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RG Mart | Order Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 27px;
            font-weight: bold;
        }

        .logo span {
            color: #ff3030;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        .container {
            max-width: 650px;
            margin: 65px auto;
            padding: 0 20px;
        }

        .success-card {
            background: white;
            padding: 40px 30px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
        }

        .success-icon {
            width: 85px;
            height: 85px;
            margin: 0 auto 22px;
            border-radius: 50%;
            background: #e4f8eb;
            color: #159447;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
        }

        h1 {
            font-size: 29px;
            margin-bottom: 12px;
            color: #159447;
        }

        .message {
            color: #666;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .order-details {
            background: #f8f9fb;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 12px 0;
            border-bottom: 1px solid #e8e8e8;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #666;
        }

        .detail-value {
            font-weight: bold;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .total {
            color: #e60000;
            font-size: 19px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 13px;
        }

        .primary {
            background: #e60000;
            color: white;
        }

        .primary:hover {
            background: #bd0000;
        }

        .secondary {
            background: #eee;
            color: #333;
        }

        .secondary:hover {
            background: #ddd;
        }

        @media (max-width: 600px) {
            header {
                padding: 18px 5%;
            }

            .container {
                margin: 30px auto;
            }

            .success-card {
                padding: 30px 18px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo"><span>RG</span> MART</div>
    <a href="/">Home</a>
</header>

<div class="container">

    <div class="success-card">

        <div class="success-icon">✓</div>

        <h1>Order Placed Successfully!</h1>

        <p class="message">
            Thank you for shopping with RG Mart.
            Your order has been placed successfully.
        </p>

        <div class="order-details">

            <div class="detail-row">
                <span class="detail-label">Order ID</span>
                <span class="detail-value">#{{ order.id }}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Order Status</span>
                <span class="detail-value">{{ order.status }}</span>
            </div>

            <div class="detail-row">
                <span class="detail-label">Total Amount</span>
                <span class="detail-value total">
                    ₹{{ order.total_amount }}
                </span>
            </div>

        </div>

        <a href="{% url 'order_history' %}" class="btn primary">
            View My Orders
        </a>

        <a href="/" class="btn secondary">
            Continue Shopping
        </a>

    </div>

</div>

</body>
</html>
